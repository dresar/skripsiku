<header class="sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm">
    <div class="flex items-center justify-between h-14 md:h-16 px-4 md:px-6">
        <button @click="sidebarOpen = !sidebarOpen" class="p-2 rounded-lg text-slate-600 hover:bg-slate-100 lg:hidden" aria-label="Toggle menu">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <h2 class="text-lg md:text-xl font-semibold text-slate-800 truncate">
            {{ page_title | default('Dashboard') }}
        </h2>
        <div class="flex items-center gap-2">
            <span class="hidden sm:inline text-sm text-slate-500">Realtime IoT</span>
            <span id="ws-indicator" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse" title="Connecting..."></span>
        </div>
    </div>
</header>
